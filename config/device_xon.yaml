# Brain Products X.on Cihaz ve Akis Yapilandirmasi
# PLAN.md Bolum 2.2 ve agy_tasks/01_faz0_faz2.md uyarinca hazirlanmistir.

stream:
  type: "EEG"
  name_prefix: "X.on"
  nominal_srate: 250.0
  channel_format: "float32"

channels:
  count: 11
  labels:
    - "F3"
    - "F4"
    - "C3"
    - "Cz"
    - "C4"
    - "P3"
    - "P4"
    - "BIP"
    - "accX"
    - "accY"
    - "accZ"
  indices:
    eeg: [0, 1, 2, 3, 4, 5, 6]
    bip: 7
    accelerometer: [8, 9, 10]
    motor_imagery:
      C3: 2
      Cz: 3
      C4: 4
    frontal:
      F3: 0
      F4: 1
    parietal:
      P3: 5
      P4: 6
  types:
    0: "EEG"
    1: "EEG"
    2: "EEG"
    3: "EEG"
    4: "EEG"
    5: "EEG"
    6: "EEG"
    7: "EEG"
    8: "AUX"
    9: "AUX"
    10: "AUX"
  units:
    eeg: "uV"
    bip: "uV"
    accelerometer: "mg0"

hardware_filters:
  high_pass_hz: 0.5
  low_pass_hz: 65.0

impedance_thresholds_kohm:
  target_cz_level: 20000.0
  acceptable: 40000.0
  poor: 70000.0
